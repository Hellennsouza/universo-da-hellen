name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela uma publicação que já começou.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Injeta a medição em todas as páginas HTML apenas durante o deploy.
      # Preserva os arquivos originais do repositório.
      - name: Instalar integração de Analytics e consentimento
        run: python3 scripts/injetar-analytics.py .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Nome único por tentativa: evita o erro "Vários artefatos com o nome
      # github-pages" quando o fluxo é executado novamente (Re-run).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
