<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">XAI e SHAP — Inteligência Artificial Explicável</title>
<desc id="desc">Capa abstrata com as letras XAI, SHAP e gráfico de contribuição de variáveis.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#081532"/><stop offset=".55" stop-color="#17244c"/><stop offset="1" stop-color="#3d2468"/>
  </linearGradient>
  <radialGradient id="glow" cx="52%" cy="32%" r="78%">
    <stop offset="0" stop-color="#a45be5" stop-opacity=".26"/><stop offset="1" stop-color="#081532" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#88a8ed" stroke-opacity=".075" stroke-width="1.5"/>
  </pattern>
  <linearGradient id="positive" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ed5aab"/><stop offset="1" stop-color="#ff95ce"/>
  </linearGradient>
  <linearGradient id="negative" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#459ddf"/><stop offset="1" stop-color="#60e3f5"/>
  </linearGradient>
  <filter id="softglow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#glow)"/>
