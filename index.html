     /* Títulos principais */
h1, h2, h3 {
  font-family: "Times New Roman", Times, serif;
  font-weight: 700;
  letter-spacing: -0.025em;
}

/* Textos e elementos interativos */
body, p, button, nav {
  font-family: Arial, Helvetica, sans-serif;
}

/* Ajustes para todas as telas */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  max-width: 100%;
}

body {
  margin: 0;
  max-width: 100%;
}

img, video, iframe {
  max-width: 100%;
}

.area-image {
  display: block;
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 14px;
  margin-bottom: 16px;
}

/* Celulares */
@media (max-width: 768px) {

  .wrap {
    width: calc(100% - 32px);
    max-width: 100%;
    margin-inline: auto;
  }

  .hero-inner,
  .about,
  .area-grid,
  .outcomes-grid,
  .cv-grid,
  .lab-grid,
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }

  .hero-inner > *,
  .about > *,
  .area-grid > *,
  .grid > * {
    min-width: 0;
  }

  .section {
    padding-top: 48px;
    padding-bottom: 48px;
  }

  h1 {
    font-size: clamp(2rem, 9vw, 3rem);
    line-height: 1.12;
  }

  h2 {
    font-size: clamp(1.6rem, 7vw, 2.2rem);
    line-height: 1.2;
  }

  p {
    overflow-wrap: break-word;
  }

  .area-image {
    height: auto;
    aspect-ratio: 16 / 9;
    object-fit: cover;
  }

  .window {
    width: 100%;
    max-width: 100%;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .searchbar,
  .searchbar input {
    max-width: 100%;
    min-width: 0;
  }

  .menu-toggle {
    display: inline-flex;
  }
}
